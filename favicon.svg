<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#2d7a4f"/>
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="white" stroke-width="0.75" opacity="0.5"/>
  <g transform="translate(16,16)" fill="white">
    <!-- Cardinal points: N, S, E, W -->
    <polygon points="0,-13 2,-7 0,-3.5 -2,-7"/>
    <polygon points="0,13 2,7 0,3.5 -2,7"/>
    <polygon points="13,0 7,2 3.5,0 7,-2"/>
    <polygon points="-13,0 -7,2 -3.5,0 -7,-2"/>
    <!-- Intercardinal tick marks -->
    <line x1="9" y1="-9" x2="10.5" y2="-10.5" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="9" y1="9" x2="10.5" y2="10.5" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-9" y1="9" x2="-10.5" y2="10.5" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-9" y1="-9" x2="-10.5" y2="-10.5" stroke="white" stroke-width="1" opacity="0.6"/>
    <!-- Center -->
    <circle r="2.5"/>
    <circle r="1.2" fill="#2d7a4f"/>
  </g>
</svg>
